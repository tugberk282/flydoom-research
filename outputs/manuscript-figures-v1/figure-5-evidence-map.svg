   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="113.407153" y="53.004994" transform="rotate(-0 113.407153 53.004994)">Development finding</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(113.407153 65.310759)">MaleCNS BM has dense, reciprocal</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(113.407153 75.320759)">partner topology</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="250.005553" y="53.004994" transform="rotate(-0 250.005553 53.004994)">Mechanistic model</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(250.005553 65.310759)">Partner topology → class allocation</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(250.005553 75.320759)">→ dominant sensory-axis gain</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="386.603953" y="53.004994" transform="rotate(-0 386.603953 53.004994)">External tests</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(386.603953 66.056696)">FAFB controls + BANC local</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(386.603953 76.066696)">mechanism audit</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="161.618353" y="160.162594" transform="rotate(-0 161.618353 160.162594)">Supported</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(161.618353 173.214296)">Structural excess survives</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(161.618353 182.478359)">side/count matching</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="330.357553" y="160.162594" transform="rotate(-0 330.357553 160.162594)">Not established</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(330.357553 172.468359)">BM specificity and local mechanism</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'" transform="translate(330.357553 182.478359)">do not replicate decisively</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="299.020273" y="18.5652" transform="rotate(-0 299.020273 18.5652)">Evidence map: from development result to bounded conclusion</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="299.020273" y="219.8916" transform="rotate(-0 299.020273 219.8916)">Current conclusion: a reproducible structural contrast and a constrained mechanistic hypothesis—not a confirmed sex-specific discovery.</text>
   </g>
